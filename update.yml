name: تحديث مباريات الدوري الإنجليزي

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-premier-league-json
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تحديث ملف JSON
        run: python update.py

      - name: حفظ التحديثات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة."
          else
            git commit -m "تحديث بيانات مباريات الدوري الإنجليزي"
            git push
          fi
